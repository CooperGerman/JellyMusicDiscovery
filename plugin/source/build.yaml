version: "0.1.2.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "self-hosted"
artifacts:
  - "JellyMusicDiscovery.dll"
overview: "Search MusicBrainz inside Jellyfin and request via Lidarr / slskd."
description: >
  Adds a MusicBrainz-powered discovery layer to Jellyfin's music library.
  Search results for content you don't yet own appear inline alongside your
  library items. Requesting an album triggers Lidarr; playing a single track
  triggers an on-demand slskd download that streams progressively as it
  arrives.
category: "Metadata"
changelog: >
  Build for Jellyfin 12.1 on .NET 10. Fix synthetic-video playback reporting and restrict web-card script injection to HTML documents.
